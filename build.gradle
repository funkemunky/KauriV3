plugins {
    id 'base'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

allprojects {
    group = 'dev.brighten.ac'
    version = '3.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url = uri('https://nexus.funkemunky.cc/repository/maven-central/') }
        maven { url = uri('https://nexus.funkemunky.cc/content/repositories/releases/') }
        maven { url = uri('https://nexus.funkemunky.cc/repository/releases/') }
        maven { url = uri('https://nexus.funkemunky.cc/repository/mixed/') }
        maven { url = uri('https://repo.viaversion.com') }
        maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
        maven { url = uri('https://repo.aikar.co/content/groups/aikar/') }
        maven { url = uri('https://jitpack.io') }
        maven { url = uri('https://repo.lucko.me/') }
        maven { url = uri('https://repo.codemc.io/repository/maven-releases/') }
        maven { url = uri('https://repo.codemc.io/repository/maven-snapshots/') }
    }
}

subprojects {
    apply plugin: 'java-library'

    dependencies {
        compileOnly 'org.jetbrains:annotations:26.0.2'
        testImplementation 'junit:junit:4.13.2'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-XDignore.symbol.file']
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnit()
    }
}

project(':Anticheat') {
    apply plugin: 'com.github.johnrengelman.shadow'

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
        compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
        compileOnly 'org.yaml:snakeyaml:2.2'
        compileOnly 'com.viaversion:viaversion-api:latest.release'
        compileOnly 'com.shevchik.protocolsupport:protocolsupport:1.8'
        compileOnly 'org.dizitart:nitrite:4.3.0'
        compileOnly 'org.dizitart:nitrite-mvstore-adapter:4.3.0'
        compileOnly 'org.dizitart:nitrite-jackson-mapper:4.2.2'
        compileOnly 'it.unimi.dsi:fastutil:8.5.11'

        implementation project(':emulator')
        implementation project(':API')
        implementation project(':Compat')
        implementation project(':LegacyAPI')
        implementation project(':ModernAPI')

        implementation 'com.google.guava:guava:33.4.0-jre'
        implementation 'org.slf4j:slf4j-api:2.0.13'
        implementation 'org.ow2.asm:asm:9.8'
        implementation 'org.ow2.asm:asm-tree:9.8'
        implementation 'org.ow2.asm:asm-commons:9.8'
        implementation 'com.github.retrooper:packetevents-spigot:2.11.1'
        implementation 'co.aikar:acf-bukkit:0.5.1-SNAPSHOT'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }

    shadowJar {
        archiveClassifier.set('')
        minimize()
        relocate 'co.aikar', 'dev.brighten.ac.libs.co.aikar'
        relocate 'net.jodah', 'dev.brighten.ac.libs.net.jodah'
        relocate 'com.github.retrooper', 'dev.brighten.ac.libs.com.github.retrooper'
        relocate 'io.github.retrooper', 'dev.brighten.ac.libs.io.github.retrooper'
        relocate 'net.kyori', 'dev.brighten.ac.libs.com.github.retrooper.packetevents.libs.net.kyori'
        relocate 'com.google.common', 'dev.brighten.ac.libs.com.google.common'
        relocate 'com.google.errorprone', 'dev.brighten.ac.libs.com.google.errorprone'
        relocate 'com.google.j2objc', 'dev.brighten.ac.libs.com.google.j2objc'
        relocate 'com.fasterxml', 'dev.brighten.ac.libs.com.fasterxml'
        relocate 'javax.annotation', 'dev.brighten.ac.libs.javax.annotation'
        relocate 'org.h2', 'dev.brighten.ac.libs.org.h2'
        relocate 'org.checkerframework', 'dev.brighten.ac.libs.org.checkerframework'
        relocate 'org.slf4j', 'dev.brighten.ac.libs.org.slf4j'
        relocate 'me.hydro', 'dev.brighten.ac.libs.me.hydro'
        relocate 'it.unimi', 'dev.brighten.ac.libs.it.unimi'
        relocate 'org.objectweb', 'dev.brighten.ac.libs.org.objectweb'
        relocate 'org.yaml.snakeyaml', 'dev.brighten.ac.libs.org.yaml.snakeyaml'
        relocate 'org.dizitart', 'dev.brighten.ac.libs.org.dizitart'
    }

    tasks.named('jar') {
        enabled = false
    }

    tasks.named('assemble') {
        dependsOn tasks.named('shadowJar')
    }
}

project(':API') {
    dependencies {
        compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    }
}

project(':LegacyAPI') {
    dependencies {
        implementation project(':API')
        compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    }
}

project(':ModernAPI') {
    dependencies {
        implementation project(':API')
        compileOnly 'org.spigotmc:spigot-api:1.12-R0.1-SNAPSHOT'
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    }
}

project(':Compat') {
    dependencies {
        implementation project(':emulator')
        compileOnly 'org.spigotmc:spigot-api:1.19.4-R0.1-SNAPSHOT'
        compileOnly 'com.github.retrooper:packetevents-spigot:2.8.0'
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    }
}

project(':Compat-1_19_R3') {
    dependencies {
        compileOnly 'org.spigotmc:spigot-api:1.19.4-R0.1-SNAPSHOT'
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    }
}

project(':emulator') {
    group = 'me.hydro'
    version = '1.2.1-neo'

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'
        testCompileOnly 'org.projectlombok:lombok:1.18.30'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
        compileOnly 'com.google.guava:guava:33.4.0-jre'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }
}
